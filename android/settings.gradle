pluginManagement {
    def pubCachePath = System.getenv("PUB_CACHE") ?: "${System.getProperty("user.home")}/.pub-cache"
    def hostedDir = new File(pubCachePath, "hosted")
    if (hostedDir.directory) {
        hostedDir.eachDir { repositoryDir ->
            repositoryDir.eachDir { packageDir ->
                if (!packageDir.name.startsWith("isar_flutter_libs-")) {
                    return
                }
                def buildFile = new File(packageDir, "android/build.gradle")
                if (!buildFile.file) {
                    return
                }
                def original = buildFile.getText("UTF-8")
                def updated = original
                    .replace("compileSdkVersion 30", "compileSdkVersion 36")
                    .replace("minSdkVersion 16", "minSdkVersion 24")
                if (!updated.contains("namespace")) {
                    updated = updated.replace(
                        "android {",
                        "android {\n    namespace 'dev.isar.isar_flutter_libs'"
                    )
                }
                if (updated != original) {
                    buildFile.write(updated, "UTF-8")
                }
            }
        }
    }

    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
