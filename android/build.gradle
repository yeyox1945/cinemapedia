allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("../build"))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = subproject.file("src/main/AndroidManifest.xml")
            def manifestNamespace = null
            if (manifestFile.exists()) {
                def matcher = manifestFile.getText("UTF-8") =~ /package="([^"]+)"/
                if (matcher.find()) {
                    manifestNamespace = matcher.group(1)
                }
            }
            androidExt.namespace = manifestNamespace ?: subproject.group.toString()
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
